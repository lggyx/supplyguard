[package]
name = "supplyguard"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Multi-Agent supply chain security defense system for the AI coding era"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3"
assert_cmd = "2.2.2"
predicates = "3.1.4"
