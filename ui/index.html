<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SupplyGuard Console</title>
  <link rel="stylesheet" href="/assets/css/app.css" />
  <script src="/vendor/echarts.min.js"></script>
  <script type="module" src="/assets/js/app.js"></script>
</head>
<body>
  <div id="app">
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark">SG</span>
        <span class="brand-name">SupplyGuard</span>
      </div>
      <nav class="nav" id="nav">
        <button class="nav-item" data-view="overview">总览 <span class="nav-dot" id="navDot"></span></button>
        <button class="nav-item" data-view="scans">扫描详情</button>
        <button class="nav-item" data-view="timeline">裁决时间线</button>
        <button class="nav-item" data-view="audit">审计链</button>
      </nav>
      <div class="sidebar-footer">
        <div class="conn" id="conn"><span class="conn-dot"></span><span id="connLabel">连接中…</span></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <h1 id="title">总览 Overview</h1>
        <div class="actions">
          <input class="input" id="scanPath" type="text" value="fixtures/demo-app" placeholder="项目目录路径，如 fixtures/demo-app" />
          <button class="btn primary" id="btnScan">运行扫描</button>
          <button class="btn" id="btnGuard">守门演示</button>
        </div>
      </header>
      <div class="statusbar hidden" id="reconnBar">连接断开，重连中…（SSE 自动退避重连 ≤5s）</div>
      <div class="statusbar error hidden" id="errorBar">
        <span id="errorText">数据加载失败</span>
        <button class="btn small" id="btnRetry">重试</button>
      </div>

      <!-- Overview -->
      <section class="view" id="view-overview">
        <div class="cards" id="statCards"></div>
        <div class="panel">
          <h2>最近扫描</h2>
          <div class="skeleton-lines hidden" id="recentSkeleton">
            <div class="skel skel-line"></div><div class="skel skel-line"></div><div class="skel skel-line"></div>
          </div>
          <div class="empty hidden" id="recentEmpty">暂无扫描记录 —— 运行一次扫描试试</div>
          <table class="table hidden" id="recentTable">
            <thead><tr><th>会话</th><th>来源</th><th>风险</th><th>裁决</th></tr></thead>
            <tbody id="recentBody"></tbody>
          </table>
        </div>
        <div class="panel"><h2>风险分布</h2><div id="chart-risk" class="chart"></div></div>
      </section>

      <!-- Scan detail -->
      <section class="view hidden" id="view-scans">
        <div class="panel">
          <h2>会话列表</h2>
          <div class="empty hidden" id="scanListEmpty">暂无会话 —— 先运行一次扫描</div>
          <table class="table hidden" id="scanListTable">
            <thead><tr><th>会话</th><th>风险</th><th>裁决</th><th></th></tr></thead>
            <tbody id="scanListBody"></tbody>
          </table>
        </div>
        <div class="panel hidden" id="detailPanel">
          <h2>依赖与信号 <span class="mono dim" id="detailSession"></span></h2>
          <div id="detailReasons"></div>
          <h3>依赖清单</h3>
          <table class="table hidden" id="pkgTable">
            <thead><tr><th>包</th><th>版本</th><th>License</th><th>直接依赖</th></tr></thead>
            <tbody id="pkgBody"></tbody>
          </table>
          <h3>证据链</h3>
          <table class="table hidden" id="evidenceTable">
            <thead><tr><th>Skill</th><th>来源</th><th>置信度</th><th>摘要</th></tr></thead>
            <tbody id="evidenceBody"></tbody>
          </table>
        </div>
      </section>

      <!-- Timeline -->
      <section class="view hidden" id="view-timeline">
        <div class="panel">
          <h2>状态机时间线</h2>
          <div class="empty hidden" id="timelineEmpty">暂无会话</div>
          <div class="timeline-picker hidden" id="timelinePicker">
            <select class="input" id="timelineSession"></select>
          </div>
          <div class="timeline hidden" id="timelineSteps"></div>
        </div>
      </section>

      <!-- Audit chain -->
      <section class="view hidden" id="view-audit">
        <div class="panel">
          <h2>审计链 <span class="pill hidden" id="auditPill"></span></h2>
          <div class="empty hidden" id="auditEmpty">审计链为空 —— 运行一次扫描或守门</div>
          <table class="table hidden" id="auditTable">
            <thead><tr><th>#</th><th>会话</th><th>事件</th><th>裁决</th><th>证据哈希</th><th>entry_hash</th></tr></thead>
            <tbody id="auditBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
